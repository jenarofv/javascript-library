<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="style.css" rel="stylesheet">
  <script src="script.js" defer></script>
</head>
<body>
<header><h1>Javascript Library</h1></header>
<div>
  <table>
    <caption> Books on your library</caption>
    <thead>
      <tr>
        <th scope="col">Author</th>
        <th scope="col">Title</th>
        <th scope="col">Pages</th>
        <th scope="col">Read</th>
      </tr>
    </thead>
    <tbody id="booklist">
    </tbody>
  </table>

  <div class="book-form-container">
    <h2> Add your own book</h2>
    <form id="book-form" method="POST" action="#" name="book-form">
      <div>
        <label for="title" > Book title:</label>
        <input id="title" name="title" type="text" required>
      </div>
      <div>
        <label for="author" > Book author:</label>
        <input id="author" name="author" type="text" required>
      </div>
      <div>
        <label for="pages" > Total pages:</label>
        <input id="pages" name="pages" type="number" required>
      </div>
      <div>
        <label for="read" > Already read book?</label>
        <input id="read" name="read" type="checkbox">
        <span class="hidden"> yes </span>
      </div>
      <button type="submit" id="add-book"> Add to bookshelf</button>
    </form>
  </div>

</div>
</body>
</html>
